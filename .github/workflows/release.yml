name: Windows Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      publish:
        description: '构建成功后发布 Release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Validate version
        id: version
        run: |
          $source = Get-Content packaging/windows/AECStudio.iss -Raw
          $match = [regex]::Match($source, '(?m)^AppVersion=(\d+\.\d+\.\d+)\r?$')
          if (-not $match.Success) { throw 'Missing installer version' }
          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag must match installer AppVersion'
          }
          "number=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Prepare Python dependencies
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install torch==2.9.1 torchaudio==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'CPU runtime installation failed' }
          .venv/Scripts/python.exe -m pip install -r requirements-studio.txt
          if ($LASTEXITCODE -ne 0) { throw 'Application dependencies failed' }
          .venv/Scripts/python.exe -m pip download --no-deps torch==2.9.1 torchaudio==2.9.1 --index-url https://download.pytorch.org/whl/cpu --dest "$env:RUNNER_TEMP/downloads/cpu-wheels"
          if ($LASTEXITCODE -ne 0) { throw 'CPU wheel download failed' }
      - name: Run regression tests
        run: |
          .venv/Scripts/python.exe -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
          node tests/test_ui_render.cjs
          if ($LASTEXITCODE -ne 0) { throw 'UI tests failed' }
      - name: Download release inputs
        run: |
          .venv/Scripts/python.exe scripts/prepare-release-inputs.py --downloads "$env:RUNNER_TEMP/downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Release input preparation failed' }
          .venv/Scripts/python.exe -c "from huggingface_hub import hf_hub_download; hf_hub_download('TaurenMountain/PS4', 'checkpoint_epoch037.pt', revision='8feb7a1b3da1264659f155c42bfb40a5be88d730', local_dir='models/ps4')"
          if ($LASTEXITCODE -ne 0) { throw 'PS4 model download failed' }
      - name: Install Inno Setup
        run: |
          choco upgrade innosetup --version=7.1.1 --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}/Inno Setup */ISCC.exe","$env:ProgramFiles/Inno Setup */ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler missing' }
          "INNO_COMPILER=$($compiler.FullName)" >> $env:GITHUB_ENV
      - name: Build installer
        run: |
          ./scripts/build-windows-installer.ps1 -Downloads "$env:RUNNER_TEMP/downloads" -BuildRoot "$env:RUNNER_TEMP/build" -OutputRoot "$env:GITHUB_WORKSPACE/dist" -InnoCompiler "$env:INNO_COMPILER"
      - name: Verify packaged runtime and generate checksum
        run: |
          $report = "$env:RUNNER_TEMP/runtime-check.json"
          $hostProcess = Start-Process "$env:RUNNER_TEMP/build/app/AECStudio.exe" -ArgumentList @('--self-test','--deep','--output',$report) -WindowStyle Hidden -Wait -PassThru
          if ($hostProcess.ExitCode -ne 0) { throw 'Packaged runtime self-test failed' }
          $installer = Get-Item "dist/AECStudio-Setup-${{ steps.version.outputs.number }}-x64.exe"
          $digest = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($digest.Hash)  $($installer.Name)" | Set-Content "dist/$($installer.BaseName).sha256" -Encoding ascii
          .venv/Scripts/python.exe -m pip freeze | Set-Content dist/build-dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AECStudio-${{ steps.version.outputs.number }}-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish Release
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; publish a new version instead' }
          gh release create $env:RELEASE_TAG ./dist/* --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AEC Studio $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
